<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exemplo — header (mock) PCA</title>
    <link rel="stylesheet" href="../tokens/tokens.css" />
    <style>
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--surface-paper);
        color: var(--text-on-paper);
        min-height: 100vh;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 4.25rem;
        padding: 0 1.25rem;
        background: var(--surface-ink);
        color: var(--text-on-ink);
      }
      .bar .mark {
        width: 2.75rem;
        height: 2.75rem;
        padding: 0.2rem;
        box-sizing: border-box;
        background: var(--color-papel);
        border-radius: var(--radius-sm);
      }
      .bar .mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .bar .lockup {
        display: none;
        width: min(14rem, 40vw);
        padding: 0.25rem 0.35rem;
        background: var(--color-papel);
        border-radius: var(--radius-sm);
        box-sizing: border-box;
      }
      .bar .lockup img {
        width: 100%;
        height: auto;
        aspect-ratio: 2313 / 1008;
      }
      @media (min-width: 900px) {
        .bar .mark,
        .bar .word {
          display: none;
        }
        .bar .lockup {
          display: block;
        }
      }
      .bar strong {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 600;
      }
      .bar small {
        display: block;
        font-family: var(--font-sans);
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-on-ink-muted);
        margin-top: 0.15rem;
      }
      .note {
        max-width: 28rem;
        margin: 2rem auto;
        padding: 0 1.25rem;
        font-size: 0.85rem;
        color: var(--text-on-paper-muted);
      }
    </style>
  </head>
  <body>
    <header class="bar" aria-label="Mock de header institucional">
      <span class="mark">
        <img
          src="../../assets/img/logo-pca/LOGO_PCA_Master_Mono_1C_128.webp"
          width="128"
          height="128"
          alt=""
        />
      </span>
      <span class="lockup">
        <img
          src="../../assets/img/logo-pca/LOGO_PCA_Lockup_Horizontal_Mono_1C_240.webp"
          width="240"
          height="105"
          alt="Projeto Caserna de Adulão"
        />
      </span>
      <div class="word">
        <strong>Projeto Caserna de Adulão</strong>
        <small>Mobile: Master · Desktop: Lockup Horizontal</small>
      </div>
    </header>
    <p class="note">
      Header responsivo: Master + texto (&lt;900px) ou Lockup Horizontal (≥900px),
      ambos em placa <code>--color-papel</code>.
      <a href="../laboratorio/index.html">Lab</a> ·
      <a href="cartao-mock.html">Cartão</a> ·
      <a href="assinatura-mock.html">Assinatura</a>
    </p>
  </body>
</html>
