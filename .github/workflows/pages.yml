name: Publicar Pages

# Publica índices, assets e protótipos públicos do Discipulando.
# Homologação, Guia, docs internos, ferramentas, testes e referências
# DevTools ficam fora do artefato.
# Ver programas/discipulando-a-caserna/docs/publicacao.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Montar artefato público
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Regenerar dados do prospecto
        run: npm run generate:discipulando
      - name: Montar pasta pública
        run: |
          set -euo pipefail
          P=programas/discipulando-a-caserna
          mkdir -p _site/$P/prototipos
          cp index.html robots.txt 404.html _site/
          cp -r assets _site/
          cp $P/index.html _site/$P/
          cp -r $P/assets _site/$P/
          cp -r $P/prototipos/prospecto-v1 _site/$P/prototipos/
          cp -r $P/prototipos/storytelling-v1 _site/$P/prototipos/
          cp -r $P/prototipos/direcoes-visuais-v1 _site/$P/prototipos/
          mkdir -p _site/prototipos/storytelling-v1
          mkdir -p _site/prototipos/direcao-a
          mkdir -p _site/prototipos/direcao-b
          mkdir -p _site/prototipos/direcao-c
          cp prototipos/storytelling-v1/index.html _site/prototipos/storytelling-v1/
          cp prototipos/direcao-a/index.html _site/prototipos/direcao-a/
          cp prototipos/direcao-b/index.html _site/prototipos/direcao-b/
          cp prototipos/direcao-c/index.html _site/prototipos/direcao-c/
          touch _site/.nojekyll
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
