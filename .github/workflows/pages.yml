name: Publicar Pages

# Publica o prospecto e os protótipos (storytelling-v1 e direções).
# Apresentação, Guia, docs internos e skills ficam fora do artefato.
# Ver docs/arquitetura/ADR-002-publicacao-e-github-pages.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Montar artefato público
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Regenerar dados do prospecto
        run: npm run generate
      - name: Montar pasta pública
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html robots.txt 404.html _site/
          cp -r css js assets prototipos _site/
          touch _site/.nojekyll
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
