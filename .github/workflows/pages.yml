name: Publicar Pages

# Publica apenas a allowlist de estado-publicacao.json (PUB-F5-01 suspensa).
# Dispara somente após Qualidade bem-sucedida no mesmo SHA de main.
# Ver programas/discipulando-a-caserna/docs/publicacao.md

on:
  workflow_run:
    workflows: ["Qualidade"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Montar artefato público
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Regenerar dados do prospecto público
        run: npm run generate:discipulando
      - name: Validar política de publicação
        run: npm run validate:pages:policy
      - name: Montar pasta pública
        run: npm run build:pages
      - name: Validar artefato
        run: npm run validate:pages:artifact
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
