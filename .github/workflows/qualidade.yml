name: Qualidade

on:
  push:
    branches: [main, work]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    name: Validar repositório
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Validação completa
        run: npm run validate
